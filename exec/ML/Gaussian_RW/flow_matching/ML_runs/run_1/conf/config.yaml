defaults:
  - override /hydra/launcher: joblib

n_range : [0,50]
n_scale: 51
n_samples: 10000
batch_size: 186
df: 4.0
max_iter: 250000
n_iter_per_epoch: 5000
learning_rate : 1e-4
model:
  history_length : 1
  n_layers     : 4
  layer_width  : 16
  act_func:
    _target_ : "torch.nn.Tanh"
  residual_con : true
  train: true
  file_name: ""
n_sampling_steps: 20

